<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="base :: head('Perfil')">
</head>
<body>
<nav th:replace="base :: navbar"></nav>

<div class="container" style="margin-top: 80px;">

    <h2>Editar Perfil</h2>
    <hr/>
    <form method="post" th:action="@{'/user/guardar'}" th:object="${usuario}">
        <input type="hidden" th:field="*{id_user}" />
        <div class="form-group">
            <label for="firstname">Nombre</label>
            <input id="firstname" type="text" class="form-control" th:field="*{firstname}">
        </div>
        <div class="form-group">
            <label for="lastname">Apellido</label>
            <input id="lastname" type="text" class="form-control" th:field="*{lastname}">
        </div>
        <div class="form-group">
            <label for="intro">Texto de introduccion</label>
            <input id="intro" type="text" class="form-control" th:field="*{intro}">
        </div>
        <div class="form-group">
            <label for="profile">Texto de Perfil</label>
            <textarea id="profile" class="form-control" rows="4" th:field="*{profile}"></textarea>
        </div>
        <a th:href="@{'/user'}" class="btn btn-danger">Cancelar</a>
        <button type="submit" class="btn btn-primary">Actualizar</button>
    </form>
</div>
</body>
</html>
