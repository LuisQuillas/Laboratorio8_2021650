<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="base :: head('Usuarios')">
</head>
<body>
<nav th:replace="base :: navbar"></nav>

<div class="container" style="margin-top: 80px;">

    <h2>Lista Usuarios</h2>

    <div th:if="${msg != null}" th:text="${msg}" class="alert alert-success" role="alert"></div>

    <table class="table table-sm table-bordered">
        <tr>
            <th>#</th>
            <th>ID</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Correo</th>
            <th>Rol</th>
            <th></th>
            <th></th>
        </tr>
        <tr th:each="usuario, info : ${listausuarios}">
            <td th:text="${info.index + 1}"></td>
            <td th:text="${usuario.id_user}"></td>
            <td th:text="${usuario.firstname}"></td>
            <td th:text="${usuario.lastname}"></td>
            <td th:text="${usuario.email}"></td>
            <td th:text="${usuario.id_role != null ? usuario.id_role.role_name : '-'}"></td>
            <td><a class="btn btn-primary btn-sm"
                   th:href="@{'/user/editar' + '?id=' + ${usuario.id_user}}">Editar</a>
            </td>
            <td><a class="btn btn-danger btn-sm"
                   th:href="@{'/user/borrar' + '?id=' + ${usuario.id_user}}"
                   onclick="return confirm('¿Seguro que desea borrar este usuario?');">Borrar</a>
            </td>
        </tr>
    </table>
</div>
</body>
</html>
