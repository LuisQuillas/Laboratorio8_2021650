<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" >
<head th:replace="base :: head('Post')">
</head>
<body>
<nav th:replace="base :: navbar"></nav>

<div class="container" style="margin-top: 80px;">

    <h2 th:text="${post.id_Post == 0 ? 'Nuevo Post' : 'Editar Post'}">Nuevo/Editar</h2>
    <hr/>
    <form method="post" th:action="@{'/post/guardar'}" th:object="${post}">
        <input type="hidden" th:field="*{id_Post}" />
        <div class="form-group">
            <label for="title">Titulo</label>
            <input id="title" type="text" class="form-control" th:field="*{title}">
        </div>
        <div class="form-group">
            <label for="summary">Resumen</label>
            <input id="summary" type="text" class="form-control" th:field="*{summary}">
        </div>
        <div class="form-group">
            <label for="content">Contenido</label>
            <textarea id="content" class="form-control" rows="5" th:field="*{content}"></textarea>
        </div>
        <a th:href="@{'/post'}" class="btn btn-danger">Cancelar</a>
        <button type="submit" class="btn btn-primary" th:text="${post.id_Post == 0 ? 'Registrar' : 'Actualizar'}">Reg/act</button>
    </form>
</div>
</body>
</html>
