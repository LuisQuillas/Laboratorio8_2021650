spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/Lab5?serverTimezone=America/Lima&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.show-sql=true
server.servlet.context-path=/
server.port=8080
spring.output.ansi.enabled=ALWAYS
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Reintentos de conexion a la base de datos al iniciar (util cuando MySQL
# todavia esta levantando dentro del contenedor de Docker).
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000
